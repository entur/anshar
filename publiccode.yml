description:
  en:
    localisedName: Anshar
    shortDescription: Publish-subscribe hub that collects and redistributes real-time SIRI data.
    longDescription: >
      Anshar is the national hub for real-time public transport data in Norway. It subscribes to SIRI endpoints
      operated by transport companies, collects SIRI-ET, SIRI-VM and SIRI-SX messages, and republishes the
      aggregated data on its own endpoints for consumers such as journey planners and passenger information
      systems. Both subscription-based and request-response exchange are supported.
      Anshar validates incoming XML against the SIRI XML schema and against a configurable profile subset, by
      default the Norwegian SIRI profile, and reports the results per codespace. It exposes live statistics for
      all subscriptions, and it runs as a cluster of Spring Boot instances with liveness, readiness and health
      endpoints.
    documentation: https://github.com/entur/anshar/blob/master/README.md
    features:
      - Subscribes to external SIRI endpoints and manages subscriptions
      - Serves SIRI-ET, SIRI-VM and SIRI-SX to downstream consumers
      - Validation against the SIRI schema and the Norwegian SIRI profile
      - Per-subscription status and statistics endpoints
      - Clustered operation with health, liveness and readiness probes

